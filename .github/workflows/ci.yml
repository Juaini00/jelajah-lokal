name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal default token scope; no job needs elevated permissions.
permissions:
  contents: read

env:
  NODE_VERSION: "24.19.0"
  PNPM_VERSION: "10.33.4"
  UV_VERSION: "0.11.21"
  PYTHON_VERSION: "3.13"

jobs:
  frontend:
    name: Frontend typecheck + build (web, admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (astro check + tsc -b)
        run: pnpm check

      - name: Build (astro build + vite build)
        run: pnpm build

  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jelajah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d jelajah_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # Isolated CI-only Postgres service container; never the dev/prod database.
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/jelajah_test
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/jelajah_test
      ENVIRONMENT: test
      AI_ENABLED: "false"
      MCP_ENABLED: "true"
      MCP_API_KEY: ci-test-mcp-key-not-for-production-use
      ADMIN_SESSION_SECRET: ci-test-session-secret-not-for-production
      ADMIN_COOKIE_NAME: jelajah_session
      ADMIN_COOKIE_SECURE: "false"
      ADMIN_ALLOWED_ORIGINS: '["http://127.0.0.1:8000"]'
      CORS_ALLOWED_ORIGINS: "[]"
      MEDIA_ALLOWED_HOSTS: '["res.cloudinary.com"]'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies (locked)
        working-directory: apps/api
        run: uv sync --locked

      - name: Run Alembic migrations against the isolated test database
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: pytest
        working-directory: apps/api
        run: uv run pytest

  bruno-acceptance:
    name: Bruno API acceptance
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jelajah_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d jelajah_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/jelajah_ci
      ENVIRONMENT: test
      # Deterministic AI coverage: BackendProduct3's app/testing.py build_test_app()
      # dependency-overrides only the Gemini HTTP client (FakeGeminiClient) behind
      # scripts.run_test_harness below. AI_ENABLED/GEMINI_MODEL/GEMINI_API_KEY must
      # still be set and non-empty for editorial routes to be reachable at all;
      # GEMINI_API_KEY/GEMINI_MODEL values here are dummy strings — never sent to
      # any real provider because the client itself is swapped. Quota/lease/cache
      # logic runs unmodified against the real isolated Postgres service above, so
      # daily-limit and concurrent-lease scenarios are genuinely deterministic.
      # Caveat (per BackendProduct3): the MCP server's generate_metadata tool always
      # uses the real Gemini client regardless of which app module is served here —
      # do not route MCP generate_metadata acceptance checks through this harness
      # expecting deterministic output.
      AI_ENABLED: "true"
      GEMINI_MODEL: ci-test-dummy-model
      GEMINI_API_KEY: ci-test-dummy-key-never-sent-to-provider
      MCP_ENABLED: "true"
      MCP_API_KEY: ci-test-mcp-key-not-for-production-use
      ADMIN_SESSION_SECRET: ci-test-session-secret-not-for-production
      ADMIN_COOKIE_NAME: jelajah_session
      ADMIN_COOKIE_SECURE: "false"
      ADMIN_ALLOWED_ORIGINS: '["http://127.0.0.1:8000"]'
      CORS_ALLOWED_ORIGINS: "[]"
      MEDIA_ALLOWED_HOSTS: '["res.cloudinary.com"]'
      API_CONTENT_TOKEN: ci-test-content-token
      API_PUBLIC_URL: http://127.0.0.1:8000
      # CI-only bootstrapped principals consumed by tests/bruno/environments/ci.bru.
      # Not production defaults; scripts.bootstrap never seeds any account, and the
      # editor principal is a fresh bootstrap (zero owned articles) by construction.
      JELAJAH_TEST_ADMIN_USERNAME: ci-admin
      JELAJAH_TEST_ADMIN_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD || 'Ci-Test-Only-Admin-1!' }}
      JELAJAH_TEST_EDITOR_USERNAME: ci-editor
      JELAJAH_TEST_EDITOR_PASSWORD: ${{ secrets.CI_EDITOR_PASSWORD || 'Ci-Test-Only-Editor-1!' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install root dependencies (frozen lockfile, includes Bruno CLI)
        run: pnpm install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies (locked)
        working-directory: apps/api
        run: uv sync --locked

      - name: Run Alembic migrations against the isolated CI database
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Bootstrap CI-only admin and editor principals
        working-directory: apps/api
        run: |
          uv run python -m scripts.bootstrap \
            --username "$JELAJAH_TEST_ADMIN_USERNAME" \
            --password "$JELAJAH_TEST_ADMIN_PASSWORD" \
            --role admin
          uv run python -m scripts.bootstrap \
            --username "$JELAJAH_TEST_EDITOR_USERNAME" \
            --password "$JELAJAH_TEST_EDITOR_PASSWORD" \
            --role editor

      - name: Start API instance (deterministic Gemini test harness)
        working-directory: apps/api
        run: |
          uv run python -m scripts.run_test_harness --host 127.0.0.1 --port 8000 &
          echo $! > "$RUNNER_TEMP/api.pid"

      - name: Wait for API readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz; then
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready in time" >&2
          exit 1

      - name: Bruno API acceptance
        working-directory: tests/bruno
        run: pnpm exec bru run --env ci

      - name: Stop API instance
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null || true
